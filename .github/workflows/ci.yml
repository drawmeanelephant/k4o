name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        zig: ["0.17.0"]
    steps:
      - uses: actions/checkout@v7

      # Pinned by commit SHA (tag v2.2.1-node24). Maintained fork of
      # mlugg/setup-zig: upstream moved to Codeberg and the GitHub copy has been
      # stale since v2.2.1 (Jan 2026). The only functional change is
      # runs.using node20 -> node24, clearing the Actions Node 20 deprecation.
      # To bump, replace the SHA with the new tag's commit and update the tag
      # comment.
      - name: Install Zig
        uses: drawmeanelephant/zig-zouave@2d8510d62b517fa786279562cf8b1bdcf0c47b9f
        with:
          version: ${{ matrix.zig }}

      - name: zig version
        run: zig version

      - name: Build
        run: zig build --summary all

      - name: Test
        run: zig build test --summary all

  differential:
    name: differential + CommonMark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig
        uses: drawmeanelephant/zig-zouave@2d8510d62b517fa786279562cf8b1bdcf0c47b9f
        with:
          version: 0.17.0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pinned black-box knap
        run: npm ci --prefix tools/differential --ignore-scripts --no-audit --no-fund

      - name: Build pinned Oliver
        run: |
          git clone --filter=blob:none https://github.com/drawmeanelephant/oliver.git "$RUNNER_TEMP/oliver"
          git -C "$RUNNER_TEMP/oliver" checkout --detach 967bfdf428ff58b9b6e292d2f0d05184e929fb92
          (cd "$RUNNER_TEMP/oliver" && zig build -Doptimize=ReleaseSafe --prefix "$RUNNER_TEMP/oliver-install")

      - name: Compare bytes and parse CommonMark
        run: |
          zig build
          python3 tools/differential/run.py --oliver "$RUNNER_TEMP/oliver-install/bin/oliver"

  verify:
    # The project's real asset: the red-green mutant modes must FAIL, the CLI
    # smoke tests and static cross-build must pass, and README's generated
    # results table must match this run. A mutant that starts passing means the
    # suite has stopped discriminating, which fails the build here.
    name: verify
    runs-on: ubuntu-latest
    env:
      KT_VERIFY_DIR: ${{ github.workspace }}/verify-logs
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig
        uses: drawmeanelephant/zig-zouave@2d8510d62b517fa786279562cf8b1bdcf0c47b9f
        with:
          version: "0.17.0"

      - name: zig version
        run: zig version

      - name: Full verification (mutants must fail)
        run: tools/verify.sh --check-readme

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-logs
          path: verify-logs/
          if-no-files-found: ignore
          retention-days: 7
